name: Deploy Porch War
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Restore published portraits
        run: |
          curl --fail --location --retry 3 -o /tmp/porch-art-portraits-web.zip https://github.com/Mrimagemakers/PorchWar/releases/download/v0.2-art/porch-art-portraits-web.zip
          echo "ac37d24d4d3acd91c76977cc137eb1b47bc6f0b60f966c1d5ea56fd07152c749  /tmp/porch-art-portraits-web.zip" | sha256sum -c
          unzip -o /tmp/porch-art-portraits-web.zip
          test "$(find models/rigged -name '*.glb' | wc -l)" -eq 13
          test -f models/props/ferris-wheel.glb
      - name: Package public game files
        run: |
          mkdir _site
          cp *.html *.css *.js _site/
          cp -r vendor _site/
          for dir in models portraits references; do
            if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
          done
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - uses: actions/deploy-pages@v4
        id: deployment
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
